[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-wallpapers"
dynamic = ["version"]
description = "OVOS wallpapers skill"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "skill", "plugin"]
dependencies = [
    "requests",
    "ovos-utils>=0.0.38,<1.0.0",
    "ovos-workshop>=9.6.0a1,<10.0.0"
]

[project.optional-dependencies]
test = [
    "ovoscope>=1.6.9a1,<2.0.0",
    "pytest>=7.0.0,<9",
    "pytest-timeout>=2.0.0",
    "padacioso>=1.0.2a3",
    "ovos-adapt-parser>=1.6.3a1",
    "ovos-padatious>=2.0.7a1",
    "ovos-core>=3.2.5a1",
    "ovos-spec-tools>=1.10.4a1"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-skill-wallpapers"

[project.entry-points."opm.skill"]
"skill-ovos-wallpapers.openvoiceos" = "ovos_skill_wallpapers:WallpapersSkill"

[tool.setuptools]
packages = ["ovos_skill_wallpapers"]

[tool.setuptools.package-dir]
ovos_skill_wallpapers = ""

[tool.setuptools.dynamic]
version = {attr = "ovos_skill_wallpapers.version.__version__"}

[tool.setuptools.package-data]
ovos_skill_wallpapers = [
    "*.json",
    "locale/**/*",
    "locale/*/*.voc",
    "locale/*/*.intent",
    "locale/*/*.dialog",
    "locale/*/*.entity",
    "locale/*/*.blacklist",
]
